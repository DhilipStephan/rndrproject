version: "3.8"

services:
  backend:
    build: ./backend
    container_name: rndr-backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
    restart: always

  frontend:
    build: ./frontend
    container_name: rndr-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: always

