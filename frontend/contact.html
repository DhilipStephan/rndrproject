<!DOCTYPE html>
<html>
<head>
  <title>Contact | RNDR EXPORTES</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <h1>RNDR EXPORTES</h1>
  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="services.html">Services</a>
    <a href="partners.html">Partners</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<section>
  <h2 class="section-title">Contact Us</h2>

  <form id="contactForm" style="max-width:500px;margin:auto;">
    <input type="text" id="name" placeholder="Your Name" required><br><br>
    <input type="email" id="email" placeholder="Your Email" required><br><br>
    <textarea id="message" placeholder="Your Message" rows="5" required></textarea><br><br>
    <button type="submit">Send Message</button>
  </form>

  <p id="response" style="text-align:center;margin-top:20px;"></p>
</section>

<footer>© 2026 RNDR EXPORTES</footer>

<script>
document.getElementById("contactForm").addEventListener("submit", async function(e) {
  e.preventDefault();

  const data = {
    name: name.value,
    email: email.value,
    message: message.value
  };

	<!--const res = await fetch("http://localhost:3000/contact", { -->
	const res = await fetch("http://backend:3000/contact", {
     method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data)
  });

  const result = await res.json();
  document.getElementById("response").innerText = result.message;
  this.reset();
});
</script>

</body>
</html>
